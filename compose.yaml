name: course-rag

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-course_rag}"
      POSTGRES_USER: "${POSTGRES_USER:-course_rag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-course_rag}"
    # The database is only reachable inside the Compose network; it is not
    # published to the host by default.  See docs/database.md for a temporary
    # override when host-side debugging is needed.
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  backend:
    image: course-rag-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-30}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-10485760}"
      # Passed through from .env or the process environment; defaults match
      # the application's built-in defaults (reranker off, relevance
      # threshold 0.35, candidate pool 15). Explicit values override these.
      RAG_RERANKER_ENABLED: "${RAG_RERANKER_ENABLED:-false}"
      RAG_RERANKER_MODEL: "${RAG_RERANKER_MODEL:-}"
      RAG_RERANKER_CANDIDATE_TOP_K: "${RAG_RERANKER_CANDIDATE_TOP_K:-15}"
      RAG_MIN_RELEVANCE_SCORE: "${RAG_MIN_RELEVANCE_SCORE:-0.35}"
      # Database foundation: the default backend stays memory, so the backend
      # does not depend on the db service and never connects during normal
      # memory-mode startup.  The pgvector backend is wired in a later PR.
      VECTOR_STORE_BACKEND: "${VECTOR_STORE_BACKEND:-memory}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://course_rag:course_rag@db:5432/course_rag}"
      HF_HOME: /cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/sentence-transformers
    expose:
      - "8000"
    volumes:
      - rag-runtime:/app/data/runtime
      - huggingface-cache:/cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 5
    stop_grace_period: 30s

  frontend:
    image: course-rag-frontend:local
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 10s

volumes:
  rag-runtime:
    name: course-rag-runtime
  huggingface-cache:
    name: course-rag-huggingface-cache
  postgres-data:
    name: course-rag-postgres-data
