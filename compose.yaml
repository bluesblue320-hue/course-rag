name: course-rag

services:
  backend:
    image: course-rag-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-30}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-10485760}"
      RAG_RERANKER_ENABLED: "false"
      RAG_MIN_RELEVANCE_SCORE: "0.35"
      HF_HOME: /cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/sentence-transformers
    expose:
      - "8000"
    volumes:
      - rag-runtime:/app/data/runtime
      - huggingface-cache:/cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 5
    stop_grace_period: 30s

  frontend:
    image: course-rag-frontend:local
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 10s

volumes:
  rag-runtime:
    name: course-rag-runtime
  huggingface-cache:
    name: course-rag-huggingface-cache
