name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: the workflow only reads the repository contents and
# never needs write access to issues, PRs, or the codebase itself.
permissions:
  contents: read

# Only one workflow run per branch at a time; a newer push cancels the older
# in-progress run so no stale checks pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, syntax, compose config)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Explicit isolation of LLM, Reranker, and model-download behavior:
      # the CI environment never carries real credentials, never enables a
      # real Reranker, and any accidental model download fails fast instead
      # of silently hitting the network.
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      LLM_MODEL: ""
      LLM_TIMEOUT_SECONDS: "30"
      RAG_RERANKER_ENABLED: "false"
      RAG_RERANKER_MODEL: ""
      RAG_RERANKER_CANDIDATE_TOP_K: "15"
      RAG_MIN_RELEVANCE_SCORE: "0.35"
      # The database foundation is provisioned but inactive: the default
      # backend stays memory and no real PostgreSQL is started in CI.
      VECTOR_STORE_BACKEND: "memory"
      DATABASE_URL: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/course-rag-hf
      SENTENCE_TRANSFORMERS_HOME: /tmp/course-rag-hf/sentence-transformers
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Explicit pip cache with a CPU-specific key.  This intentionally
      # differs from the old default key so the ~2.6 GB GPU dependency cache
      # from earlier runs is never restored; a cache miss simply re-installs
      # the CPU-only torch wheel from the CPU index.
      - name: Cache pip packages (CPU-only)
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-cpu-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-torch-2.13.0
          restore-keys: |
            pip-cpu-${{ runner.os }}-

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      # Runs after all backend dependencies (including NumPy) are installed:
      # importing PyTorch before NumPy exists triggers a transient NumPy
      # initialization warning, and the +cpu suffix / CUDA-absence checks are
      # only meaningful once the full runtime is in place.
      - name: Assert CPU-only PyTorch runtime
        run: |
          python - <<'PY'
          import torch
          assert torch.__version__.endswith("+cpu"), f"expected CPU-only torch build, got {torch.__version__}"
          assert torch.version.cuda is None, f"CUDA-enabled torch build, got cuda={torch.version.cuda}"
          assert torch.cuda.is_available() is False, "torch.cuda.is_available() must be False on CPU-only builds"
          print(f"CPU-only PyTorch verified: {torch.__version__} (cuda={torch.version.cuda}, available={torch.cuda.is_available()})")
          PY

      - name: Python syntax check
        run: python -m compileall -q src scripts tests

      # Unit tests run in memory mode and must never connect to a database;
      # real-PostgreSQL coverage lives in the dedicated integration job.
      - name: Backend tests
        run: python -m pytest -q --ignore=tests/integration

      # Deterministic answer-quality smoke test.  This runs the offline
      # responses mode against a small committed fixture: it never loads an
      # embedding model, never calls an LLM, never touches the network or
      # PostgreSQL, and never loads a real reranker.  The environment keeps
      # LLM_* empty and HF offline, so any accidental model or network use
      # fails fast.
      - name: Deterministic answer evaluation smoke test
        run: |
          python -m scripts.evaluate_answers \
            --dataset tests/fixtures/answer_evaluation/dataset.jsonl \
            --annotations tests/fixtures/answer_evaluation/annotations.jsonl \
            --responses tests/fixtures/answer_evaluation/responses.jsonl \
            --output-dir /tmp/answer-quality-evaluation \
            --run-name ci-fixture \
            --model-label deterministic-fixture

          test -s /tmp/answer-quality-evaluation/summary.json
          test -s /tmp/answer-quality-evaluation/cases.jsonl
          test -s /tmp/answer-quality-evaluation/report.md

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/answer-quality-evaluation")
          summary = json.loads(
              (root / "summary.json").read_text(encoding="utf-8")
          )

          assert summary["evaluation_type"] == "answer_quality"
          assert summary["dataset_counts"]["total"] > 0

          # Offline runs must record every input path as a safe
          # repository-relative path (or bare filename), never as an
          # absolute path and never as null.
          config = summary["run_configuration"]
          assert config["responses_path"] is not None
          assert not config["dataset_path"].startswith("/")
          assert not config["annotations_path"].startswith("/")
          assert not config["responses_path"].startswith("/")
          assert ":\\" not in config["dataset_path"]
          assert ":\\" not in config["annotations_path"]
          assert ":\\" not in config["responses_path"]

          case_lines = [
              line
              for line in (root / "cases.jsonl")
              .read_text(encoding="utf-8")
              .splitlines()
              if line.strip()
          ]
          assert len(case_lines) == summary["dataset_counts"]["total"]
          for line in case_lines:
              json.loads(line)

          report = (root / "report.md").read_text(encoding="utf-8")
          assert "方法限制" in report
          assert "strict" in report.lower() or "严格" in report
          PY

      - name: Docker Compose config check
        run: docker compose config --quiet

      # Verifies that the pgvector override selects the backend without
      # replacing an operator-provided DATABASE_URL.  A custom connection
      # string must survive the merge untouched.
      - name: Verify custom DATABASE_URL preserved by pgvector override
        run: |
          export CUSTOM_DATABASE_URL="postgresql+psycopg://custom_user:custom_password@db:5432/custom_db"
          DATABASE_URL="$CUSTOM_DATABASE_URL" \
            docker compose -f compose.yaml -f compose.pgvector.yaml config --format json \
            > /tmp/compose-pgvector-config.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("/tmp/compose-pgvector-config.json").read_text(encoding="utf-8")
          )
          environment = config["services"]["backend"]["environment"]
          assert environment["VECTOR_STORE_BACKEND"] == "pgvector"
          expected = "postgresql+psycopg://custom_user:custom_password@db:5432/custom_db"
          assert environment["DATABASE_URL"] == expected, environment["DATABASE_URL"]
          print("custom DATABASE_URL preserved:", environment["DATABASE_URL"])
          PY

      # Renders the full production stack (compose.yaml + pgvector override +
      # production override) with fake values and asserts port isolation,
      # the pgvector backend, persistent volumes, restart policies, startup
      # dependencies, log rotation, and the one-shot migration service.
      # No container is started and no real secret is used.
      - name: Production Compose config check
        run: |
          cat > /tmp/course-rag-prod-ci.env <<'ENV'
          DOMAIN=rag.example.com
          POSTGRES_DB=course_rag
          POSTGRES_USER=course_rag
          POSTGRES_PASSWORD=ci-only-placeholder
          DATABASE_URL=postgresql+psycopg://course_rag:ci-only-placeholder@db:5432/course_rag
          LLM_API_KEY=ci-placeholder
          LLM_BASE_URL=https://llm.example.invalid/v1
          LLM_MODEL=ci-placeholder
          LLM_TIMEOUT_SECONDS=30
          RAG_MIN_RELEVANCE_SCORE=0.35
          MAX_UPLOAD_BYTES=10485760
          RAG_RERANKER_ENABLED=false
          RAG_RERANKER_MODEL=
          RAG_RERANKER_CANDIDATE_TOP_K=15
          ENV
          # Job-level offline defaults intentionally set DATABASE_URL and
          # LLM_* empty. Process environment wins over --env-file, so clear
          # those inherited values for this isolated production render.
          unset DOMAIN POSTGRES_PASSWORD DATABASE_URL LLM_API_KEY LLM_BASE_URL LLM_MODEL
          docker compose \
            --env-file /tmp/course-rag-prod-ci.env \
            -f compose.yaml \
            -f compose.pgvector.yaml \
            -f compose.prod.yaml \
            config --quiet
          docker compose \
            --env-file /tmp/course-rag-prod-ci.env \
            -f compose.yaml \
            -f compose.pgvector.yaml \
            -f compose.prod.yaml \
            config --format json \
            > /tmp/course-rag-prod-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("/tmp/course-rag-prod-compose.json").read_text(encoding="utf-8")
          )
          services = config["services"]

          assert set(services) == {"db", "migrate", "backend", "frontend", "caddy"}

          def published(name):
              return list(services[name].get("ports", []))

          def published_port(entry):
              if isinstance(entry, dict):
                  return str(entry["published"]), entry.get("protocol", "tcp")
              if isinstance(entry, str):
                  value, _, protocol = entry.partition("/")
                  return value.rsplit(":", 1)[-1], protocol or "tcp"
              raise TypeError(entry)

          # Port isolation: only Caddy publishes host ports.
          for name in ("db", "migrate", "backend", "frontend"):
              assert published(name) == [], f"{name} must not publish host ports: {published(name)}"
          caddy_ports = published("caddy")
          tcp = {published_port(e) for e in caddy_ports if published_port(e)[1] == "tcp"}
          udp = {published_port(e) for e in caddy_ports if published_port(e)[1] == "udp"}
          assert tcp == {("80", "tcp"), ("443", "tcp")}, caddy_ports
          assert udp == {("443", "udp")}, caddy_ports

          # Backend must use pgvector with the operator-provided DATABASE_URL.
          backend_env = services["backend"]["environment"]
          assert backend_env["VECTOR_STORE_BACKEND"] == "pgvector"
          assert backend_env["DATABASE_URL"] == (
              "postgresql+psycopg://course_rag:ci-only-placeholder@db:5432/course_rag"
          )
          assert "course_rag:course_rag" not in backend_env["DATABASE_URL"]

          # Every production backend process start must wait for the existing
          # database connection and schema readiness checks before Uvicorn.
          backend = services["backend"]
          backend_command = "\n".join(backend["command"])
          gate_source = backend_command.split("python - <<'PY'\n", 1)[1].split(
              "\nPY\n", 1
          )[0]
          compile(gate_source, "<production-readiness-gate>", "exec")

          for required in (
              "create_database_engine",
              "check_database_connection",
              "check_database_schema",
              "max_attempts = 60",
              "retry_seconds = 2",
              "SystemExit(1)",
              "uvicorn",
              "src.api:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8000",
          ):
              assert required in backend_command, required
          assert "alembic upgrade head" not in backend_command

          # The command may reference the DATABASE_URL variable by name, but
          # rendered secret values and unrelated secret variables must never
          # be embedded in the process command or its logs.
          assert backend_env["DATABASE_URL"] not in backend_command
          assert "POSTGRES_PASSWORD" not in backend_command
          assert "LLM_API_KEY" not in backend_command
          assert "print(database_url" not in backend_command
          assert "print(exc" not in backend_command
          assert "repr(exc" not in backend_command

          # Production health is semantic, not HTTP-only. A degraded 200 must
          # fail unless the complete local RAG runtime initialized correctly.
          health_test = "\n".join(backend["healthcheck"]["test"])
          compile(backend["healthcheck"]["test"][-1], "<production-healthcheck>", "exec")
          for required in (
              "/health",
              "status",
              "ok",
              "retrieval_ready",
              "generation_ready",
              "rag_ready",
          ):
              assert required in health_test, required
          assert ".read()" not in health_test

          # Persistent volumes.
          def has_named_volume(name, source, target):
              return any(
                  volume.get("type") == "volume"
                  and volume.get("source") == source
                  and volume.get("target") == target
                  for volume in services[name].get("volumes", [])
              )

          assert has_named_volume("db", "postgres-data", "/var/lib/postgresql/data")
          assert has_named_volume("backend", "rag-runtime", "/app/data/runtime")
          assert has_named_volume("backend", "huggingface-cache", "/cache/huggingface")
          caddy_volumes = services["caddy"]["volumes"]
          caddyfile = [v for v in caddy_volumes if v["target"] == "/etc/caddy/Caddyfile"]
          assert caddyfile and caddyfile[0].get("type") == "bind"
          assert caddyfile[0].get("read_only") is True
          assert has_named_volume("caddy", "caddy-data", "/data")
          assert has_named_volume("caddy", "caddy-config", "/config")

          volumes = config["volumes"]
          assert volumes["postgres-data"]["name"] == "course-rag-postgres-data"
          assert volumes["rag-runtime"]["name"] == "course-rag-runtime"
          assert volumes["huggingface-cache"]["name"] == "course-rag-huggingface-cache"
          assert volumes["caddy-data"]["name"] == "course-rag-caddy-data"
          assert volumes["caddy-config"]["name"] == "course-rag-caddy-config"

          # Restart policies.
          for name in ("db", "backend", "frontend", "caddy"):
              assert services[name].get("restart") == "unless-stopped", name
          assert services["migrate"].get("restart") == "no"

          # Startup dependencies.
          assert services["migrate"]["depends_on"]["db"]["condition"] == "service_healthy"
          assert services["backend"]["depends_on"]["migrate"]["condition"] == "service_completed_successfully"
          assert services["backend"]["depends_on"]["db"]["condition"] == "service_healthy"
          assert services["caddy"]["depends_on"]["backend"]["condition"] == "service_healthy"
          assert services["caddy"]["depends_on"]["frontend"]["condition"] == "service_healthy"

          # Container hardening on every production service.
          for name in ("db", "migrate", "backend", "frontend", "caddy"):
              assert "no-new-privileges:true" in services[name].get("security_opt", []), name

          # Bounded log rotation.
          for name in ("db", "backend", "frontend", "caddy"):
              options = services[name]["logging"]["options"]
              assert options.get("max-size") == "10m", name
              assert options.get("max-file") == "3", name

          # One-shot migration service.
          assert services["migrate"]["command"] == ["alembic", "upgrade", "head"]

          print("production compose assertions passed")
          PY

      # Required production secrets must fail fast: with an empty
      # POSTGRES_PASSWORD, DOMAIN, DATABASE_URL, or LLM_API_KEY the rendered
      # production config must error instead of silently inheriting an unsafe
      # local default.
      - name: Production required-secret fail-fast check
        run: |
          unset DOMAIN POSTGRES_PASSWORD DATABASE_URL LLM_API_KEY LLM_BASE_URL LLM_MODEL
          for var in POSTGRES_PASSWORD DOMAIN DATABASE_URL LLM_API_KEY; do
            sed "s/^${var}=.*/${var}=/" /tmp/course-rag-prod-ci.env \
              > "/tmp/course-rag-empty-${var}.env"
            if docker compose \
              --env-file "/tmp/course-rag-empty-${var}.env" \
              -f compose.yaml \
              -f compose.pgvector.yaml \
              -f compose.prod.yaml \
              config --quiet; then
              echo "expected production config to fail with empty ${var}"
              exit 1
            fi
          done
          echo "all required-secret fail-fast checks passed"

      # Validates the production Caddyfile with the exact Caddy image used by
      # the production stack.  No certificate is requested and nothing is
      # started: `caddy validate` only parses and checks the configuration.
      - name: Validate production Caddyfile
        run: |
          CADDY_IMAGE=$(python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(
              Path("/tmp/course-rag-prod-compose.json").read_text(encoding="utf-8")
          )
          print(config["services"]["caddy"]["image"])
          PY
          )
          test -n "$CADDY_IMAGE"
          echo "validating with image: $CADDY_IMAGE"
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=rag.example.com \
            "$CADDY_IMAGE" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # .env.production must never be tracked; example env files stay tracked.
      - name: Assert production env is not tracked
        run: |
          if git ls-files | grep -qx '.env.production'; then
            echo ".env.production must not be tracked by git"
            exit 1
          fi
          git ls-files | grep -qx '.env.production.example'
          git ls-files | grep -qx '.env.example'
          echo "env tracking checks passed"

      # Compiles the Alembic migration chain to SQL without starting a real
      # PostgreSQL container: DATABASE_URL only needs to be a valid scheme,
      # and offline generation never opens a connection.
      - name: Compile Alembic upgrade SQL
        env:
          DATABASE_URL: postgresql+psycopg://course_rag:course_rag@localhost:5432/course_rag
        run: |
          alembic upgrade head --sql > /tmp/alembic-upgrade.sql
          test -s /tmp/alembic-upgrade.sql
          grep -q "CREATE EXTENSION IF NOT EXISTS vector" /tmp/alembic-upgrade.sql
          grep -q "CREATE TABLE documents" /tmp/alembic-upgrade.sql
          grep -q "CREATE TABLE chunks" /tmp/alembic-upgrade.sql
          grep -qi "VECTOR(384)" /tmp/alembic-upgrade.sql

  pgvector-integration:
    name: PostgreSQL pgvector integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: course_rag
          POSTGRES_USER: course_rag
          POSTGRES_PASSWORD: course_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U course_rag -d course_rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Real local test database inside the job; never uses GitHub Secrets.
      DATABASE_URL: postgresql+psycopg://course_rag:course_rag@127.0.0.1:5432/course_rag
      VECTOR_STORE_BACKEND: pgvector
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      LLM_MODEL: ""
      RAG_RERANKER_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/course-rag-hf
      SENTENCE_TRANSFORMERS_HOME: /tmp/course-rag-hf/sentence-transformers
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages (CPU-only)
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-cpu-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-torch-2.13.0
          restore-keys: |
            pip-cpu-${{ runner.os }}-

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Assert CPU-only PyTorch runtime
        run: |
          python - <<'PY'
          import torch
          assert torch.__version__.endswith("+cpu"), f"expected CPU-only torch build, got {torch.__version__}"
          assert torch.version.cuda is None, f"CUDA-enabled torch build, got cuda={torch.version.cuda}"
          assert torch.cuda.is_available() is False, "torch.cuda.is_available() must be False on CPU-only builds"
          print(f"CPU-only PyTorch verified: {torch.__version__} (cuda={torch.version.cuda}, available={torch.cuda.is_available()})")
          PY

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Show Alembic revision
        run: alembic current

      # Integration tests run against the real PostgreSQL service using
      # FakeEmbeddingService / FakeGenerationService: no model is downloaded
      # and no real LLM request is ever made.
      - name: Run pgvector integration tests
        run: python -m pytest -q tests/integration

      - name: Verify no ANN indexes and vector extension
        run: |
          python - <<'PY'
          import os
          import psycopg
          url = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT indexname, indexdef FROM pg_indexes WHERE tablename = 'chunks'")
                  rows = cur.fetchall()
                  print("chunks indexes:", rows)
                  for name, definition in rows:
                      lowered = definition.lower()
                      assert "hnsw" not in lowered, f"unexpected HNSW index: {name}"
                      assert "ivfflat" not in lowered, f"unexpected IVFFlat index: {name}"
                  cur.execute("SELECT extversion FROM pg_extension WHERE extname = 'vector'")
                  version = cur.fetchone()
                  assert version is not None, "vector extension is missing"
                  print("vector extension version:", version[0])
          PY

  frontend:
    name: Frontend (vitest, type-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: Vue production build
        working-directory: frontend
        run: npm run build
