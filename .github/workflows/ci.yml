name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: the workflow only reads the repository contents and
# never needs write access to issues, PRs, or the codebase itself.
permissions:
  contents: read

# Only one workflow run per branch at a time; a newer push cancels the older
# in-progress run so no stale checks pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, syntax, compose config)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Explicit isolation of LLM, Reranker, and model-download behavior:
      # the CI environment never carries real credentials, never enables a
      # real Reranker, and any accidental model download fails fast instead
      # of silently hitting the network.
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      LLM_MODEL: ""
      LLM_TIMEOUT_SECONDS: "30"
      RAG_RERANKER_ENABLED: "false"
      RAG_RERANKER_MODEL: ""
      RAG_RERANKER_CANDIDATE_TOP_K: "15"
      RAG_MIN_RELEVANCE_SCORE: "0.35"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/course-rag-hf
      SENTENCE_TRANSFORMERS_HOME: /tmp/course-rag-hf/sentence-transformers
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Explicit pip cache with a CPU-specific key.  This intentionally
      # differs from the old default key so the ~2.6 GB GPU dependency cache
      # from earlier runs is never restored; a cache miss simply re-installs
      # the CPU-only torch wheel from the CPU index.
      - name: Cache pip packages (CPU-only)
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-cpu-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-torch-2.13.0
          restore-keys: |
            pip-cpu-${{ runner.os }}-

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"

      - name: Assert CPU-only PyTorch runtime
        run: |
          python -c "import torch; print('torch', torch.__version__); assert torch.__version__.endswith('+cpu'), 'expected CPU-only torch build'"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax check
        run: python -m compileall -q src scripts tests

      - name: Backend tests
        run: python -m pytest -q

      - name: Docker Compose config check
        run: docker compose config --quiet

  frontend:
    name: Frontend (vitest, type-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: Vue production build
        working-directory: frontend
        run: npm run build
